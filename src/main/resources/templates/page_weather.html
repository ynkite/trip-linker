<div th:fragment="weather" xmlns:th="http://www.thymeleaf.org">
    <!-- ===================================================
     * 파일명: page_weather.html
     * 도메인: 날씨(Weather)
     * 기능:   날씨 탭 — 오늘 기준 7일 예보 동적 렌더링 (항상 현재 날짜 기준)
     =================================================== -->

    <div class="page" id="page-weather">
        <div class="info-wrap">
            <h2 style="font-size:22px;font-weight:800;margin-bottom:22px">🌤️ 날씨</h2>

            <div class="info-card">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
                    <div style="font-size:14px;font-weight:700" id="weather-tab-title">🌤️ 날씨 예보 로딩 중...</div>
                </div>
                <div class="weather-grid" id="weather-tab-grid" style="margin-top:12px"></div>
                <div id="weather-tab-alert" style="display:none;margin-top:11px;background:#FEF3F2;border:1px solid #FECACA;border-radius:8px;padding:10px;font-size:12px;color:#7F1D1D"></div>
                <div style="margin-top:10px;font-size:11px;color:var(--text3)">자세한 날씨는 아래 서비스에서 확인하세요.</div>
                <!-- 네이버·구글 날씨 이동 버튼 -->
                <div style="display:flex;gap:10px;margin-top:14px">
                    <a href="https://weather.naver.com" target="_blank"
                       style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;background:#03C75A;color:#fff;font-size:13px;font-weight:700;border-radius:9px;text-decoration:none">
                        <img src="https://ssl.pstatic.net/static/common/favicon/2023/0328/favicon.ico" alt="" width="16" height="16" style="border-radius:3px" data-onerror="this.style.display='none'">
                        네이버 날씨
                    </a>
                    <a href="https://www.google.com/search?q=날씨" target="_blank"
                       style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;background:#4285F4;color:#fff;font-size:13px;font-weight:700;border-radius:9px;text-decoration:none">
                        <img src="https://www.google.com/favicon.ico" alt="" width="16" height="16" style="border-radius:3px" data-onerror="this.style.display='none'">
                        구글 날씨
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/page/page_weather_1.js}"></script>

</div>
