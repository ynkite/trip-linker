plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    // 정적 보안 점검 (./gradlew spotbugsMain → build/reports/spotbugs/main.html). 실행 jar 에는 들어가지 않는다.
    id 'com.github.spotbugs' version '6.1.7'
}

group = 'idusw.sbb'
version = '0.0.1-SNAPSHOT'
description = 'trip-linker'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

//Spring AI 버전
ext {
    set('springAiVersion', "1.1.6")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    //JWT 토큰 발급 및 검증을 위한 jjwt 라이브러리
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    //스프링 시큐리티
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    //소셜 로그인
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    //@Valid 기능
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 이메일 발송 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Ollama
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    // ChatGPT
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // Claude
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    // Gemini
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'


}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

spotbugs {
    ignoreFailures = true          // 점검 결과로 빌드를 멈추지 않는다 (보고서만 남김)
    effort = com.github.spotbugs.snom.Effort.valueOf("MAX")
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf("MEDIUM")
}

tasks.named('spotbugsMain') {
    reports {
        html { required = true }
        xml { required = true }
    }
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'triplinker.jar'
}