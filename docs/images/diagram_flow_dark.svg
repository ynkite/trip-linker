<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 281" width="860" height="281">
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#8b949e"/></marker></defs>
<path d="M208,62.5 L220,62.5" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M421,62.5 L433,62.5" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M634,62.5 L646,62.5" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M208,192.5 L220,192.5" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M421,192.5 L433,192.5" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<path d="M634,192.5 L646,192.5" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a)"/>
<path d="M749.5,110 C749.5,130.5 110.5,118.5 110.5,139" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="18" y="20" width="185" height="85" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="110.5" y="49.0" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3">1. 여행 조건 입력</text>
<text x="110.5" y="71.0" font-size="13" text-anchor="middle" fill="#9198a1">여행지, 날짜, 인원</text>
<text x="110.5" y="89.0" font-size="13" text-anchor="middle" fill="#9198a1">예산, 이동 수단, 취향</text>
<rect x="231" y="20" width="185" height="85" rx="8" fill="#0e2a4d" stroke="#4493f8" stroke-width="1.5"/>
<text x="323.5" y="49.0" font-size="15" font-weight="700" text-anchor="middle" fill="#9ecbff">2. AI 챗봇</text>
<text x="323.5" y="71.0" font-size="13" text-anchor="middle" fill="#9198a1">채팅으로 예산 같은</text>
<text x="323.5" y="89.0" font-size="13" text-anchor="middle" fill="#9198a1">조건을 고침</text>
<rect x="444" y="20" width="185" height="85" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="536.5" y="49.0" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3">3. 장소 후보 모으기</text>
<text x="536.5" y="71.0" font-size="13" text-anchor="middle" fill="#9198a1">카카오 로컬 검색</text>
<text x="536.5" y="89.0" font-size="13" text-anchor="middle" fill="#9198a1">결과에서만 모음</text>
<rect x="657" y="20" width="185" height="85" rx="8" fill="#0e2a4d" stroke="#4493f8" stroke-width="1.5"/>
<text x="749.5" y="49.0" font-size="15" font-weight="700" text-anchor="middle" fill="#9ecbff">4. AI 방문 순서</text>
<text x="749.5" y="71.0" font-size="13" text-anchor="middle" fill="#9198a1">모은 후보 안에서</text>
<text x="749.5" y="89.0" font-size="13" text-anchor="middle" fill="#9198a1">순서만 정함</text>
<rect x="18" y="150" width="185" height="85" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="110.5" y="179.0" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3">5. 서버 검사</text>
<text x="110.5" y="201.0" font-size="13" text-anchor="middle" fill="#9198a1">못 찾은 곳, 숙소에서</text>
<text x="110.5" y="219.0" font-size="13" text-anchor="middle" fill="#9198a1">40km 넘는 곳을 지움</text>
<rect x="231" y="150" width="185" height="85" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="323.5" y="179.0" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3">6. 카카오 길찾기</text>
<text x="323.5" y="201.0" font-size="13" text-anchor="middle" fill="#9198a1">거리, 통행료,</text>
<text x="323.5" y="219.0" font-size="13" text-anchor="middle" fill="#9198a1">자동차 시간</text>
<rect x="444" y="150" width="185" height="85" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="536.5" y="179.0" font-size="15" font-weight="700" text-anchor="middle" fill="#e6edf3">7. 지도와 일정 카드</text>
<text x="536.5" y="201.0" font-size="13" text-anchor="middle" fill="#9198a1">대중교통 시간과 요금은</text>
<text x="536.5" y="219.0" font-size="13" text-anchor="middle" fill="#9198a1">서버가 계산</text>
<rect x="657" y="150" width="185" height="85" rx="8" fill="#0e2a4d" stroke="#4493f8" stroke-width="1.5"/>
<text x="749.5" y="179.0" font-size="15" font-weight="700" text-anchor="middle" fill="#9ecbff">8. 날씨가 나쁜 날</text>
<text x="749.5" y="201.0" font-size="13" text-anchor="middle" fill="#9198a1">AI 가 실내 일정 제안,</text>
<text x="749.5" y="219.0" font-size="13" text-anchor="middle" fill="#9198a1">누르면 그날만 교체</text>
<rect x="690" y="253" width="22" height="14" rx="3" fill="#0e2a4d" stroke="#4493f8" stroke-width="1.5"/>
<text x="720" y="264.5" font-size="12" fill="#9198a1">AI 가 일하는 칸</text>
<path d="M528.0,260 L560.0,260" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="574.0" y="264.5" font-size="12" fill="#9198a1">날씨가 나쁜 날만</text>
</svg>